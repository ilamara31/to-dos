<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>to-dos</title>
  <meta name="description" content="A simple, beautiful to-do app. Sponsored by ilan Games.">
  <meta name="theme-color" content="#F2575F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="to-dos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Pick the sky before the first paint (add ?sky=night etc. to the address to preview)
    (function () {
      var hr = new Date().getHours();
      var p = hr >= 5 && hr < 12 ? 'morning' : hr >= 12 && hr < 17 ? 'afternoon' : hr >= 17 && hr < 20 ? 'evening' : 'night';
      var q = new URLSearchParams(location.search).get('sky');
      if (['morning', 'afternoon', 'evening', 'night'].indexOf(q) >= 0) p = q;
      document.documentElement.setAttribute('data-phase', p);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sky: changes with the time of day -->
  <div id="sky" aria-hidden="true">
    <div class="sky-layer" data-for="morning"></div>
    <div class="sky-layer" data-for="afternoon"></div>
    <div class="sky-layer" data-for="evening"></div>
    <div class="sky-layer" data-for="night"></div>
    <div class="stars" id="stars"></div>
    <div class="sun"><div class="sun-core"></div></div>
    <div class="moon">
      <svg viewBox="0 0 200 200">
        <defs>
          <radialGradient id="moon-base" cx="42%" cy="40%" r="62%">
            <stop offset="0" stop-color="#FFFEF6"/>
            <stop offset=".65" stop-color="#ECE8D8"/>
            <stop offset="1" stop-color="#C6C0AB"/>
          </radialGradient>
          <radialGradient id="moon-limb" cx="50%" cy="50%" r="50%">
            <stop offset=".72" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#1A1810" stop-opacity=".35"/>
          </radialGradient>
          <filter id="moon-noise" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="4" seed="4"/>
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer><feFuncA type="linear" slope="0" intercept=".5"/></feComponentTransfer>
          </filter>
          <filter id="moon-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
          <clipPath id="moon-clip"><circle cx="100" cy="100" r="96"/></clipPath>
        </defs>
        <circle cx="100" cy="100" r="96" fill="url(#moon-base)"/>
        <g clip-path="url(#moon-clip)">
          <g fill="#8C8672" opacity=".42" filter="url(#moon-soft)">
            <path d="M52 60c14-20 48-24 60-6 10 16-4 34-24 36-20 2-46-10-36-30z"/>
            <path d="M104 78c14-8 36-4 42 10 6 16-10 26-26 24-16-2-30-24-16-34z"/>
            <ellipse cx="88" cy="120" rx="22" ry="15"/>
            <ellipse cx="140" cy="58" rx="15" ry="11"/>
            <ellipse cx="62" cy="136" rx="11" ry="8"/>
            <ellipse cx="150" cy="120" rx="9" ry="12"/>
          </g>
          <rect width="200" height="200" filter="url(#moon-noise)" opacity=".5" style="mix-blend-mode:multiply"/>
          <g fill="none" stroke="#9E9884" stroke-opacity=".55" stroke-width="1.6">
            <circle cx="118" cy="150" r="7"/>
            <circle cx="152" cy="98" r="4.5"/>
            <circle cx="44" cy="102" r="5"/>
            <circle cx="96" cy="40" r="3.5"/>
          </g>
          <circle cx="112" cy="164" r="3.2" fill="#FFFDF0"/>
          <circle cx="100" cy="100" r="96" fill="url(#moon-limb)"/>
        </g>
      </svg>
    </div>
    <div class="clouds" id="clouds"></div>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="far" d="M0 190C160 140 300 160 460 185S760 130 960 142s300 58 480 22V320H0Z"/>
      <path class="near" d="M0 250c200-34 360 8 560-6s340-48 540-14c160 26 260 8 340 2V320H0Z"/>
    </svg>
    <!-- cloud shape filters -->
    <svg width="0" height="0" style="position:absolute">
      <filter id="cloud-1" x="-60%" y="-120%" width="220%" height="340%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/>
        <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="2" result="n"/>
        <feDisplacementMap in="b" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="cloud-2" x="-60%" y="-120%" width="220%" height="340%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
        <feTurbulence type="fractalNoise" baseFrequency=".015" numOctaves="4" seed="9" result="n"/>
        <feDisplacementMap in="b" in2="n" scale="100" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="cloud-3" x="-60%" y="-120%" width="220%" height="340%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b"/>
        <feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="23" result="n"/>
        <feDisplacementMap in="b" in2="n" scale="80" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
  </div>
  <!-- Splash: shown every time the app opens -->
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img class="splash-logo" src="icons/logo.png" alt="">
      <p class="splash-app">to-dos</p>
      <div class="splash-sponsor">
        <span>sponsored by</span>
        <strong>ilan Games</strong>
      </div>
    </div>
  </div>

  <main class="app">
    <header class="top">
      <div class="top-left">
        <button type="button" class="icon-btn settings-btn" id="settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span class="music-dot" aria-hidden="true"></span>
        </button>
        <div class="brand">
          <img src="icons/logo.png" alt="" width="34" height="34">
          <span>to-dos</span>
        </div>
      </div>
      <nav class="seg" role="tablist" aria-label="Views">
        <button type="button" role="tab" data-view="today" aria-selected="true">Today</button>
        <button type="button" role="tab" data-view="plan" aria-selected="false">Plan ahead</button>
      </nav>
    </header>

    <!-- Today -->
    <section id="view-today" aria-labelledby="greeting">
      <div class="hero">
        <p class="eyebrow" id="today-date"></p>
        <h1 id="greeting">Hello</h1>
        <p class="sub">What do you want to get done today?</p>
      </div>

      <form class="composer" id="today-form" autocomplete="off">
        <input id="today-input" type="text" maxlength="300" enterkeyhint="done"
               placeholder="e.g. Finish 2 chapters of English literature" aria-label="New to-do for today">
        <button type="button" class="icon-btn mic" aria-label="Say your to-do" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V21.5"/></svg>
        </button>
        <button type="submit" class="icon-btn add-btn" aria-label="Add to-do">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div id="today-lists"></div>
    </section>

    <!-- Plan ahead -->
    <section id="view-plan" hidden aria-labelledby="plan-heading">
      <div class="hero">
        <p class="eyebrow">Plan ahead</p>
        <h1 id="plan-heading">What's the plan? 🗓️</h1>
        <p class="sub">Pick a day and add your to-dos. They'll be waiting for you on that day.</p>
      </div>

      <div class="days" id="day-strip" role="group" aria-label="Choose a day"></div>

      <div class="plan-head">
        <h2 id="plan-title"></h2>
        <p id="plan-date"></p>
      </div>

      <form class="composer" id="plan-form" autocomplete="off">
        <input id="plan-input" type="text" maxlength="300" enterkeyhint="done" aria-label="New plan">
        <button type="button" class="icon-btn mic" aria-label="Say your plan" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V21.5"/></svg>
        </button>
        <button type="submit" class="icon-btn add-btn" aria-label="Add plan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>

      <div id="plan-list"></div>
    </section>
  </main>

  <dialog class="sheet" id="sheet"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="app.js"></script>
</body>
</html>
